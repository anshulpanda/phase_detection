[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-detection"
version = "0.1.0"
description = "Tennis forehand swing-phase detection: pose-based TCN with an active-learning label pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.0",
    "opencv-python>=4.8",
    "ultralytics>=8.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Core ML export only works on macOS; kept optional so the rest installs anywhere.
coreml = ["coremltools>=7.0"]
dev = ["pytest>=7.4"]

[project.scripts]
phase-detect = "phase_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
